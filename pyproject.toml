[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-theory-b"
version = "0.5.2"
description = "Synthetic finite-course PK/PD regimen comparisons and dimensionless dose optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logos", "pharmacokinetics", "pharmacodynamics", "pkpd", "dose-optimization", "dosing-regimens", "mathematical-modeling", "computational-pharmacology", "model-informed-precision-dosing", "treatment-optimization", "drug-safety"]
classifiers = ["Programming Language :: Python :: 3.12", "Operating System :: OS Independent", "Topic :: Scientific/Engineering"]
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "matplotlib==3.10.9"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
logos-b = "logos_b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
